name = "jarvis-ai-gateway"
main = "src/index.ts"
compatibility_date = "2026-11-20"

[vars]
GEMINI_MODEL = "gemini-3.1-flash-lite"
OPENROUTER_MODEL = "openrouter/free"
GROQ_MODEL = "openai/gpt-oss-20b"
WORKERS_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"

[ai]
binding = "AI"

[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 20
period = 60

[browser]
binding = "BROWSER"

[[d1_databases]]
binding = "JARVIS_KNOWLEDGE"
database_name = "jarvis-knowledge-memory"
database_id = "a16a963c-acb4-41c0-a510-392300d95cd7"
migrations_dir = "migrations"

[triggers]
crons = ["17 */6 * * *"]
