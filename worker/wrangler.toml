name = "jarvis-ai-gateway"
main = "src/index.ts"
compatibility_date = "2026-11-20"

[vars]
GEMINI_MODEL = "gemini-3.1-flash-lite"
OPENROUTER_MODEL = "openrouter/free"
GROQ_MODEL = "openai/gpt-oss-20b"
WORKERS_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"

[ai]
binding = "AI"

[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 20
period = 60

[browser]
binding = "BROWSER"

[[d1_databases]]
binding = "DEVICE_DB"
database_name = "jarvis-device-bridge"
database_id = "63240602-5f29-49a0-be97-c210ff4c6275"
