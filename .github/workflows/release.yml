name: JARVIS signed Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.2.0"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validate signing secrets and prepare keystore
        env:
          JARVIS_KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
        run: |
          test -n "$JARVIS_KEYSTORE_BASE64" || (echo "Missing repository secret JARVIS_KEYSTORE_BASE64" && exit 1)
          test -n "${{ secrets.JARVIS_STORE_PASSWORD }}" || (echo "Missing JARVIS_STORE_PASSWORD" && exit 1)
          test -n "${{ secrets.JARVIS_KEY_ALIAS }}" || (echo "Missing JARVIS_KEY_ALIAS" && exit 1)
          test -n "${{ secrets.JARVIS_KEY_PASSWORD }}" || (echo "Missing JARVIS_KEY_PASSWORD" && exit 1)
          echo "$JARVIS_KEYSTORE_BASE64" | base64 --decode > app/jarvis-release.jks
          test -s app/jarvis-release.jks

      - name: Build signed release APK
        env:
          JARVIS_STORE_FILE: ${{ github.workspace }}/app/jarvis-release.jks
          JARVIS_STORE_PASSWORD: ${{ secrets.JARVIS_STORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
          JARVIS_VERSION: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          VERSION="${JARVIS_VERSION#v}"
          gradle assembleRelease --no-daemon --stacktrace -PjarvisVersionName="$VERSION"

      - name: Publish APK as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: JARVIS ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
