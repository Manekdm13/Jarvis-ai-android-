name: JARVIS master quality gates (no APK)

on:
  push:
    branches: [ "feature/jarvis-master-completion" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: jarvis-master-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install --no-package-lock
      - name: Test Worker authentication and provider fallback
        working-directory: worker
        run: npm test
      - name: Type-check Worker
        working-directory: worker
        run: npm run typecheck
      - name: Validate Worker bundle
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir dist

  android-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run Android JVM unit tests only (no APK packaging)
        run: gradle testDebugUnitTest --no-daemon --stacktrace --info
