name: Android debug APK, emulator tests, and signed release

on:
  push:
    branches: [ "main", "fix/jarvis-chat-gateway-ci", "feature/jarvis-3-0-21-sections" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-android-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  worker-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Termux agent Python syntax
        run: python3 -m py_compile scripts/jarvis_termux_agent.py
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install --no-package-lock
      - name: Test Cloudflare Worker authentication and provider fallback
        working-directory: worker
        run: npm test
      - name: Type-check Cloudflare Worker
        working-directory: worker
        run: npm run typecheck
      - name: Validate Cloudflare Worker deployment bundle
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Upload compiled Worker bundle for release deployment
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-worker-bundle
          path: worker/dist/**
          if-no-files-found: error

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK with actionable diagnostics
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tee app-build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            echo "## Android build failure details" >> "$GITHUB_STEP_SUMMARY"
            grep -E "e: |error:|What went wrong:|Execution failed|Unresolved reference|Could not resolve|failed to" app-build.log | tail -n 80 | tee -a "$GITHUB_STEP_SUMMARY" || true
            exit "$build_status"
          fi
      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-build-diagnostics
          path: app-build.log
          if-no-files-found: warn
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Diagnose runner disk space
        run: |
          df -h
          df -i
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable and verify KVM
        run: |
          sudo mkdir -p /etc/udev/rules.d
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Run JARVIS on Android emulator
        id: emulator-tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            bash -lc 'set -euo pipefail; mkdir -p artifacts/emulator; timeout 120s adb wait-for-device; for attempt in $(seq 1 60); do booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\\r" || true)"; if [ "$booted" = "1" ]; then break; fi; sleep 5; done; test "$(adb shell getprop sys.boot_completed | tr -d "\\r")" = "1"; adb devices -l; gradle connectedDebugAndroidTest --no-daemon --stacktrace --info'
      - name: Capture runner diagnostics if emulator action failed before test script
        if: always()
        timeout-minutes: 3
        run: |
          mkdir -p artifacts/emulator
          timeout 10s adb devices -l > artifacts/emulator/adb-devices-poststep.txt 2>&1 || true
          timeout 15s adb logcat -d -v threadtime > artifacts/emulator/logcat-poststep.txt 2>&1 || true
          find app/build/outputs -type f -print > artifacts/emulator/build-output-files.txt 2>/dev/null || true
          df -h > artifacts/emulator/disk-space.txt 2>&1 || true
      - name: Upload emulator logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-emulator-diagnostics
          path: |
            artifacts/emulator/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

  signed-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JARVIS_KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
      JARVIS_STORE_PASSWORD: ${{ secrets.JARVIS_STORE_PASSWORD }}
      JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
      JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
      JARVIS_STORE_FILE: ${{ runner.temp }}/jarvis-release-signing.jks
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Validate signing secrets and materialize temporary keystore
        shell: bash
        run: |
          set -euo pipefail
          for name in JARVIS_KEYSTORE_BASE64 JARVIS_STORE_PASSWORD JARVIS_KEY_ALIAS JARVIS_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub Actions secret $name is not configured."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$JARVIS_KEYSTORE_BASE64" | base64 --decode > "$JARVIS_STORE_FILE"
          test -s "$JARVIS_STORE_FILE"
          chmod 600 "$JARVIS_STORE_FILE"
      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$JARVIS_STORE_FILE"
