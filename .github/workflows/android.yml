name: Android debug APK and emulator tests

on:
  push:
    branches: [ "main", "fix/jarvis-chat-gateway-ci" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-android-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  worker-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install --no-package-lock
      - name: Test Cloudflare Worker authentication and provider fallback
        working-directory: worker
        run: npm test
      - name: Type-check Cloudflare Worker
        working-directory: worker
        run: npm run typecheck
      - name: Validate Cloudflare Worker deployment bundle
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Upload compiled Worker bundle for release deployment
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-worker-bundle
          path: worker/dist/**
          if-no-files-found: error

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK and run JVM unit tests
        shell: bash
        run: |
          set +e
          gradle assembleDebug testDebugUnitTest --no-daemon --stacktrace --info 2>&1 | tee app-build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            echo "## Android build or unit-test failure details" >> "$GITHUB_STEP_SUMMARY"
            grep -E "e: |error:|What went wrong:|Execution failed|Unresolved reference|Could not resolve|failed to|FAILED|tests completed" app-build.log | tail -n 100 | tee -a "$GITHUB_STEP_SUMMARY" || true
            exit "$build_status"
          fi
      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-build-diagnostics
          path: app-build.log
          if-no-files-found: warn
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Diagnose runner disk space
        run: |
          df -h
          df -i
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable and verify KVM
        run: |
          sudo mkdir -p /etc/udev/rules.d
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run JARVIS on Android emulator
        id: emulator-tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p artifacts/emulator
            # The hosted emulator occasionally appears as "offline" for a short
            # period after boot. Reconnect ADB before treating that as a test failure.
            booted=0
            for boot_attempt in $(seq 1 90); do
              adb start-server >/dev/null 2>&1 || true
              adb reconnect offline >/dev/null 2>&1 || true
              device_state="$(adb devices | awk '/emulator-/{print $2; exit}')"
              if [ "$device_state" = "device" ]; then
                boot_flag="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\\r" || true)"
                if [ "$boot_flag" = "1" ]; then booted=1; break; fi
              fi
              echo "Waiting for emulator ADB (attempt $boot_attempt; state=${device_state:-missing})"
              sleep 5
            done
            if [ "$booted" -ne 1 ]; then
              adb devices -l || true
              exit 1
            fi
            adb devices -l
            success=0
            last_status=1
            for attempt in 1 2 3 4; do
              if gradle testDebugUnitTest connectedDebugAndroidTest --no-daemon --stacktrace --info; then
                success=1
                break
              else
                last_status=$?
                if [ "$attempt" -lt 4 ]; then
                  delay=$((attempt * 30))
                  echo "Gradle test attempt $attempt failed; retrying in ${delay}s to ride out transient Maven rate limits..."
                  sleep "$delay"
                fi
              fi
            done
            if [ "$success" -ne 1 ]; then exit "$last_status"; fi
            echo "Android emulator tests completed successfully."

      - name: Capture runner diagnostics if emulator action failed before test script
        if: always()
        timeout-minutes: 3
        run: |
          mkdir -p artifacts/emulator
          timeout 10s adb devices -l > artifacts/emulator/adb-devices-poststep.txt 2>&1 || true
          timeout 15s adb logcat -d -v threadtime > artifacts/emulator/logcat-poststep.txt 2>&1 || true
          find app/build/outputs -type f -print > artifacts/emulator/build-output-files.txt 2>/dev/null || true
          df -h > artifacts/emulator/disk-space.txt 2>&1 || true

      - name: Upload emulator logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-emulator-diagnostics
          path: |
            artifacts/emulator/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 7
